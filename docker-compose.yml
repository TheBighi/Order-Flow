services:
  redis:
    image: redis:latest
    container_name: orderflow-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --requirepass "${REDIS_PASS}" --appendonly yes

  backend:
    build:
      context: ./backend
    container_name: orderflow-backend
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
    depends_on:
      - redis
    networks:
      - default
      - web

  prometheus:
    image: prom/prometheus:latest
    container_name: orderflow-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: orderflow-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
  k6:
    image: grafana/k6:latest
    profiles:
      - loadtest
    volumes:
      - ./load-test:/scripts
    command: run /scripts/k6-spike.js
    environment:
      HTTP_BASE_URL: http://backend:8000
      WS_BASE_URL: ws://backend:8000
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
networks:
  web:
    external: true

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

